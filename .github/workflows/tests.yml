name: Tests

on:
  push:
    branches:
      - practise-7
  pull_request:
    branches:
      - practise-7

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tests
        run: g++ -std=c++17 -Wall -Wextra -pedantic $(ls *.cpp | grep -v '^main\.cpp$') tests/*.cpp -o run_tests

      - name: Run unit tests
        run: ./run_tests

      - name: Build main program
        run: g++ -std=c++17 -Wall -Wextra -pedantic *.cpp -o practice

      - name: Smoke test main program
        run: ./practice
