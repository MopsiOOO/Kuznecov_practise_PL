name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка тестов
        run: g++ -std=c++17 -Wall -Wextra -pedantic book.cpp tests/test_book.cpp -o book_tests

      - name: Запуск unit-тестов
        run: ./book_tests

      - name: Сборка основной программы
        run: g++ -std=c++17 -Wall -Wextra -pedantic main.cpp book.cpp -o practice

      - name: Smoke-тест основной программы
        run: ./practice
